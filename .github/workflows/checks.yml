# The checks every PR runs. Each check is its own job, so the PR shows which one failed and the ruleset on main
# can require each by name. When a check fails, the start-ci-failure job starts the ci-failure routine, a cloud
# session that looks into the failure. See docs/ci.md.
name: Checks

on: pull_request

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dummy values that pass src/env.ts. Never real values or Actions secrets.
env:
  DB_URL: mongodb://localhost:27017/ci
  BETTER_AUTH_SECRET: ci-dummy-secret-at-least-32-characters
  BETTER_AUTH_URL: http://localhost:3000
  GOOGLE_CLIENT_ID: ci-google-client-id
  GOOGLE_CLIENT_SECRET: ci-google-client-secret
  RESEND_API_KEY: ci-resend-api-key
  RESEND_FROM_EMAIL: ci@example.com
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-google-client-id

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:types

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Starts the ci-failure routine once when a check fails: only on a run's first attempt, so a re-run never starts
  # another session, and never for a claude/ branch (a routine's own fix) or a PR from a fork (it gets no secrets).
  # A cancelled run starts nothing.
  start-ci-failure:
    needs: [lint, type-check, unit-tests, build]
    if: >-
      failure() && !cancelled()
      && github.run_attempt == 1
      && !startsWith(github.head_ref, 'claude/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Values from the PR reach the script only through env, since a branch name is untrusted input.
      # No --retry: /fire doesn't dedupe, so a retry could start two sessions.
      - env:
          ROUTINE_URL: ${{ secrets.ROUTINE_CI_FAILURE_URL }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_CI_FAILURE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed_jobs=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<< "$NEEDS")
          text="PR #$PR_NUMBER, head branch $HEAD_BRANCH, run $RUN_ID $RUN_URL, failed jobs: $failed_jobs"
          body=$(jq -n --arg text "$text" '{text: $text}')
          curl --fail-with-body --silent --show-error -X POST "$ROUTINE_URL" \
            -H "Authorization: Bearer $ROUTINE_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data "$body"
